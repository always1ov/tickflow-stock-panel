# .github/workflows/deploy.yml
#
# 等 Docker 镜像构建完成后，触发 Coolify 拉新镜像重新部署。
# 不能用 on.push 独立触发：那样会和镜像构建并行，Coolify 拉到的还是旧镜像。
#
# 必做（首次）：
#   1. Coolify 面板 → Keys & Tokens → 新建 API Token，权限只勾 Deploy，有效期设最长
#   2. 应用页 → Webhooks → 复制 Deploy webhook URL 里的 uuid
#   3. 仓库 Settings → Secrets and variables → Actions 建两个 secret：
#        COOLIFY_TOKEN  上面那个 token，多个仓库可共用
#        COOLIFY_UUID   该应用的 uuid，每个仓库不同
#   4. 确认下方 workflows 名称与本仓库构建 workflow 的 name 字段完全一致
#
# 按需改：
#   COOLIFY_URL   换成自己的地址
#   force         镜像 tag 是 latest 时用 true，强制重新拉取；否则 Coolify 可能认为没变化而跳过
#
# 前提：Cloudflare 隧道放行了 /api/v1/deploy 这一个路径，且该条 ingress 规则
#       必须排在通配符 *.域名 之前，否则会被通配符吃掉，请求打到 Traefik 上返回 404。

name: Deploy to Coolify

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed
  workflow_dispatch:

env:
  COOLIFY_URL: https://coolify.always1ov.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 构建失败时不部署；手动触发时 workflow_run 为空，直接放行
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Trigger Coolify deploy
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${{ secrets.COOLIFY_UUID }}&force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::部署触发失败"
            exit 1
          fi
          echo "::notice::部署已排队，去 Coolify 面板看进度"
