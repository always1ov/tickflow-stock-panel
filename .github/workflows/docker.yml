name: Build and Push Docker Image

# 触发:
#   - push 到 main / claude/upstream-clean: 覆盖刷新 :latest + :sha(每次提交可追溯)
#   - push 到其他工作分支: 只出 :<sha> 与 :<分支名>, **不动 :latest**(见下方守卫)
#   - 打 v* tag:    额外产出带版本号的镜像(如 :v0.1.43), 便于固定回溯
#   - 手动:         网页 Actions → Run workflow
#
# 构建策略见 docs/docker-build-convention.md:
#   两个架构各自在原生 runner 上并行构建(amd64 → ubuntu-latest,
#   arm64 → ubuntu-24.04-arm), 各推一份 by-digest 的镜像, 最后由 merge job
#   用 imagetools 合成多架构 manifest。原来是单机 QEMU 模拟 arm64,
#   前端 tsc/vite 这类 CPU 密集步骤慢 5~20 倍, 所以不再用 setup-qemu-action。
on:
  push:
    branches:
      - main
      - claude/upstream-clean
      # 可读性重构工作分支: 让「每次改好」都能自动出一版可部署镜像。
      # 它只产出 :<sha> / :refactor-readability-maintainability, 不碰 :latest。
      - refactor-readability-maintainability
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          # GitHub 托管 arm64 runner。私有仓库需要 Team/Enterprise 方案才可用;
          # 若提示 runner 不可用, 把这一行的 runner 换回 ubuntu-latest 并在
          # 下面的 Build 步骤加回 QEMU 即可(会慢, 但能跑)。
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # GitHub runner 在海外, 关掉国内镜像源(USE_CN_MIRROR=0)
          # 让构建直连官方 npm/PyPI, 反而更快更稳;
          # 本地/国内手动 docker build 仍走 Dockerfile 默认的 CN 镜像。
          build-args: |
            USE_CN_MIRROR=0
          labels: ${{ steps.meta.outputs.labels }}
          # push-by-digest: 只推镜像内容不打 tag, tag 由 merge job 统一挂到
          # 合成后的 manifest 上, 避免两个架构互相覆盖 :latest。
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # 固定 scope: 默认 gha 缓存按分支隔离, main 与 claude/upstream-clean
          # 互相不共享。按架构各给一个固定名字, 跨分支复用同一份缓存。
          # ignore-error: 缓存服务抽风时不要连累构建本身。
          cache-from: type=gha,scope=tickflow-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tickflow-${{ matrix.arch }},ignore-error=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest
    runs-on: ubuntu-latest
    needs: [build]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # 标签方案。注释刻意写在 tags 块**外面**：tags 是一个块标量，
      # metadata-action 按行切分它的内容，块内以 # 开头的行有被当成
      # 一条标签定义（而非注释）的风险，不值得赌。
      #   latest      仅发布分支(main / claude/upstream-clean)与 v* tag 覆盖 ——
      #               必须带 enable 条件，否则工作分支的推送会顶掉用户实际
      #               部署在拉的 :latest，直接污染线上。
      #   <sha>       每次构建可追溯到具体提交，工作分支唯一稳定的标识。
      #   <分支名>    斜杠转横线(claude/upstream-clean → claude-upstream-clean)，
      #               让工作分支也能直接 pull 一个可读 tag，不必记 sha。
      #   vX.Y.Z      打版本 tag 时的固定回溯点。
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/upstream-clean' }}
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
      # 镜像 manifest 合成完毕后，通知 Coolify 拉新镜像重新部署。
      # 只在发布分支与 v* tag 触发：工作分支不动 :latest，部署了也没意义。
      # force=true 是因为 tag 固定为 latest，不强制 Coolify 会认为没变化而跳过。
      # 隧道只放行 /api/v1/deploy 这一个路径，面板本体在公网不可达。
      - name: Trigger Coolify deploy
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/upstream-clean'
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://coolify.always1ov.com/api/v1/deploy?uuid=${{ secrets.COOLIFY_UUID }}&force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::部署触发失败"
            exit 1
          fi
          echo "::notice::部署已排队，去 Coolify 面板看进度"
